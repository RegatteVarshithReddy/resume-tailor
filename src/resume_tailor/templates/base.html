<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}resume-tailor{% endblock %}</title>
<style>
  :root{
    --bg:#f7f7f8; --fg:#1a1a1a; --muted:#666; --card:#fff; --border:#e2e2e5;
    --accent:#1f4e79; --accent-fg:#fff; --ok:#1a7f37; --warn:#9a6700; --bad:#b42318;
    --chip:#eceef1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161719; --fg:#e8e8ea; --muted:#9aa0a6; --card:#1f2124; --border:#33363b;
      --accent:#5b9bd5; --accent-fg:#0b1a2b; --ok:#4ac26b; --warn:#d6a635; --bad:#f2776a;
      --chip:#2a2d31;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14.5px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  a{color:var(--accent)}
  header{background:var(--card);border-bottom:1px solid var(--border);padding:.7rem 1rem;
    display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
  header .brand{font-weight:700}
  header nav a{margin-right:1rem;text-decoration:none}
  header .sp{flex:1}
  header .meta{color:var(--muted);font-size:12.5px}
  main{max-width:960px;margin:1.2rem auto;padding:0 1rem}
  h1{font-size:1.3rem;margin:.2rem 0 1rem}
  h2{font-size:1.05rem;margin:1.6rem 0 .6rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:1rem 1.1rem;margin:1rem 0}
  label{display:block;font-weight:600;margin:.7rem 0 .25rem}
  input,select,textarea{width:100%;padding:.5rem .6rem;font:inherit;color:inherit;
    background:var(--bg);border:1px solid var(--border);border-radius:7px}
  textarea{min-height:230px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .row{display:flex;gap:1rem;flex-wrap:wrap}
  .row>div{flex:1;min-width:150px}
  button,.btn{display:inline-block;margin-top:.9rem;padding:.55rem 1.1rem;font:inherit;
    font-weight:600;border:1px solid var(--border);border-radius:7px;cursor:pointer;
    background:var(--accent);color:var(--accent-fg);text-decoration:none}
  button.secondary,.btn.secondary{background:var(--card);color:var(--fg)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:.5rem .55rem;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  .chip{display:inline-block;background:var(--chip);border-radius:999px;
    padding:.1rem .55rem;font-size:12px;margin:.1rem}
  .pill{display:inline-block;border-radius:999px;padding:.05rem .5rem;font-size:11.5px;font-weight:700}
  .s-draft{background:var(--chip)} .s-applied{background:#dbeafe;color:#1e40af}
  .s-screening{background:#fef9c3;color:#854d0e} .s-interview{background:#dcfce7;color:#166534}
  .s-offer{background:#bbf7d0;color:#14532d} .s-rejected{background:#fee2e2;color:#991b1b}
  .s-archived{background:var(--chip);color:var(--muted)}
  .muted{color:var(--muted)} .warn{color:var(--warn)} .bad{color:var(--bad)} .ok{color:var(--ok)}
  pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);
    border-radius:8px;padding:.8rem;font-size:12.5px;overflow-x:auto}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:700px){.grid2{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;font-size:13px}
  .kv div:nth-child(odd){color:var(--muted)}
  fieldset.row-item{border:1px solid var(--border);border-radius:8px;padding:.6rem .8rem;margin:.6rem 0}
  fieldset.row-item legend{font-size:12px;color:var(--muted);padding:0 .3rem}
  .row-item.rm{opacity:.4}
  .inline{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap}
  .inline>div{flex:1;min-width:120px}
  .mini{padding:.3rem .5rem;font-size:12px;margin-top:0}
  .err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;border-radius:8px;
    padding:.7rem .9rem;margin:1rem 0;white-space:pre-wrap;font-size:13px}
  @media (prefers-color-scheme: dark){.err{background:#3a1d1d;color:#f2a8a0;border-color:#6b2b2b}}
</style>
</head>
<body>
<header>
  <span class="brand">📄 resume-tailor</span>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/apps">Applications</a>
    <a href="/profiles">Profiles</a>
    <a href="/settings">Settings</a>
  </nav>
  <span class="sp"></span>
  <span class="meta">v{{ version }} · engine: {{ engine }}</span>
</header>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
